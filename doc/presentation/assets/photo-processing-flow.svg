<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2377c9"/>
      <stop offset="1" stop-color="#54a3f3"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#20875f"/>
      <stop offset="1" stop-color="#35b87f"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0" stop-color="#4f46c8"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#39475f"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 44px; font-weight: 700; fill: #18202e; }
      .label { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Arial, sans-serif; font-size: 22px; fill: #ffffff; opacity: .96; }
      .note { font-family: Arial, sans-serif; font-size: 23px; fill: #253047; }
      .dark { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #253047; }
      .arrow { stroke: #39475f; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #77859a; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#f7f9fc"/>
  <text x="80" y="82" class="title">Обработка геопривязанных фотографий</text>

  <g filter="url(#shadow)">
    <rect x="80" y="210" width="260" height="150" rx="24" fill="url(#green)"/>
    <text x="210" y="262" text-anchor="middle" class="label">Frontend</text>
    <text x="210" y="306" text-anchor="middle" class="small">фото + координаты</text>
    <text x="210" y="336" text-anchor="middle" class="small">из EXIF или точки</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="210" width="260" height="150" rx="24" fill="url(#blue)"/>
    <text x="600" y="262" text-anchor="middle" class="label">Routes Service</text>
    <text x="600" y="306" text-anchor="middle" class="small">создаёт точку</text>
    <text x="600" y="336" text-anchor="middle" class="small">status = pending</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="210" width="260" height="150" rx="24" fill="#f3b82e"/>
    <text x="990" y="262" text-anchor="middle" class="label">NATS JetStream</text>
    <text x="990" y="306" text-anchor="middle" class="small">очередь задач</text>
    <text x="990" y="336" text-anchor="middle" class="small">photo.process</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1250" y="210" width="270" height="150" rx="24" fill="url(#purple)"/>
    <text x="1385" y="262" text-anchor="middle" class="label">Photo Worker</text>
    <text x="1385" y="306" text-anchor="middle" class="small">сжатие, превью</text>
    <text x="1385" y="336" text-anchor="middle" class="small">AI-описание</text>
  </g>

  <path class="arrow" d="M 340 285 H 455"/>
  <path class="arrow" d="M 730 285 H 845"/>
  <path class="arrow" d="M 1120 285 H 1235"/>

  <g filter="url(#shadow)">
    <rect x="470" y="560" width="260" height="150" rx="24" fill="#8fd2ff"/>
    <text x="600" y="612" text-anchor="middle" class="dark">PostgreSQL</text>
    <text x="600" y="656" text-anchor="middle" class="note">точка маршрута</text>
    <text x="600" y="686" text-anchor="middle" class="note">статус обработки</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1250" y="560" width="270" height="150" rx="24" fill="#8fd2ff"/>
    <text x="1385" y="612" text-anchor="middle" class="dark">MinIO / S3</text>
    <text x="1385" y="656" text-anchor="middle" class="note">оригинал фото</text>
    <text x="1385" y="686" text-anchor="middle" class="note">миниатюры и URL</text>
  </g>

  <path class="thin" d="M 600 360 V 545"/>
  <path class="thin" d="M 1385 360 V 545"/>
  <path class="thin" d="M 1250 635 H 745"/>

  <rect x="80" y="760" width="1440" height="70" rx="22" fill="#e9eef6"/>
  <text x="110" y="804" class="note">Результат: пользователь сразу видит точку на карте, а тяжёлая обработка фото выполняется в фоне без блокировки интерфейса.</text>
</svg>
