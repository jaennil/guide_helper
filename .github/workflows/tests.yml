name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/detect-changes.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/detect-changes.sh'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cache: ${{ steps.detect.outputs.cache }}
      tiles: ${{ steps.detect.outputs.tiles }}
      auth: ${{ steps.detect.outputs.auth }}
      frontend: ${{ steps.detect.outputs.frontend }}
      mobile: ${{ steps.detect.outputs.mobile }}
      workflow: ${{ steps.detect.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash ./.github/scripts/detect-changes.sh \
            'cache=^backend/cache/' \
            'tiles=^backend/tiles/' \
            'auth=^backend/auth/' \
            'frontend=^frontend/' \
            'mobile=^mobile/' \
            'workflow=^(\.github/workflows/tests\.yml|\.github/scripts/detect-changes\.sh)$'

  test-cache:
    needs: changes
    if: needs.changes.outputs.cache == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/cache/go.sum

      - name: Test cache service
        working-directory: ./backend/cache
        run: |
          go test -v ./...

  test-tiles:
    needs: changes
    if: needs.changes.outputs.tiles == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/tiles/go.sum

      - name: Test tiles service
        working-directory: ./backend/tiles
        run: |
          go test -v ./...

  test-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test auth service
        working-directory: ./backend/auth
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
        run: |
          cargo test --verbose

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint || echo "Lint command not found, skipping"

  test-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Typecheck
        working-directory: ./mobile
        run: npm run typecheck

      - name: Build Android bundle
        working-directory: ./mobile
        run: npx expo export --platform android --output-dir dist-android
