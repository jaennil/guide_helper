name: CI/CD

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Rebuild all images'
        type: boolean
        default: true
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/guide-helper

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cache: ${{ steps.filter.outputs.cache }}
      tiles: ${{ steps.filter.outputs.tiles }}
      auth: ${{ steps.filter.outputs.auth }}
      routes: ${{ steps.filter.outputs.routes }}
      photo-worker: ${{ steps.filter.outputs.photo-worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cache:
              - 'backend/cache/**'
            tiles:
              - 'backend/tiles/**'
            auth:
              - 'backend/auth/**'
            routes:
              - 'backend/routes/**'
            photo-worker:
              - 'backend/photo-worker/**'
            frontend:
              - 'frontend/**'

  build-cache:
    needs: changes
    if: needs.changes.outputs.cache == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/cache
          file: ./backend/cache/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=cache-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=cache-${{ matrix.suffix }}
          provenance: false

  merge-cache:
    needs: [changes, build-cache]
    if: needs.changes.outputs.cache == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-cache:latest

  build-tiles:
    needs: changes
    if: needs.changes.outputs.tiles == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/tiles
          file: ./backend/tiles/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=tiles-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=tiles-${{ matrix.suffix }}
          provenance: false

  merge-tiles:
    needs: [changes, build-tiles]
    if: needs.changes.outputs.tiles == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tiles:latest

  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth
          file: ./backend/auth/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=auth-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=auth-${{ matrix.suffix }}
          provenance: false

  merge-auth:
    needs: [changes, build-auth]
    if: needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:latest

  build-routes:
    needs: changes
    if: needs.changes.outputs.routes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routes
          file: ./backend/routes/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=routes-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=routes-${{ matrix.suffix }}
          provenance: false

  merge-routes:
    needs: [changes, build-routes]
    if: needs.changes.outputs.routes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-routes:latest

  build-photo-worker:
    needs: changes
    if: needs.changes.outputs.photo-worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/photo-worker
          file: ./backend/photo-worker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=photo-worker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=photo-worker-${{ matrix.suffix }}
          provenance: false

  merge-photo-worker:
    needs: [changes, build-photo-worker]
    if: needs.changes.outputs.photo-worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-photo-worker:latest

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=frontend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.suffix }}
          provenance: false
          build-args: |
            VITE_GRAPHHOPPER_API_KEY=${{ secrets.VITE_GRAPHHOPPER_API_KEY }}
            VITE_STADIA_API_KEY=${{ secrets.VITE_STADIA_API_KEY }}

  merge-frontend:
    needs: [changes, build-frontend]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${GITHUB_SHA::7}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:main-${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  update-manifests:
    needs: [changes, merge-cache, merge-tiles, merge-auth, merge-routes, merge-photo-worker, merge-frontend]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.merge-cache.result == 'success' ||
       needs.merge-tiles.result == 'success' ||
       needs.merge-auth.result == 'success' ||
       needs.merge-routes.result == 'success' ||
       needs.merge-photo-worker.result == 'success' ||
       needs.merge-frontend.result == 'success')
    concurrency:
      group: update-manifests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update manifests on latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IMAGE_TAG="${GITHUB_SHA::7}"

          current_tag_for() {
            local service="$1"
            awk -v svc="$service" '
              $1 == "-" && $2 == "name:" && $3 == svc { in_block = 1; next }
              in_block && $1 == "newTag:" { print $2; exit }
            ' kustomization.yaml
          }

          should_update_service() {
            local service="$1"
            local current_tag
            current_tag="$(current_tag_for "$service")"

            if [ -z "$current_tag" ]; then
              return 0
            fi

            local current_sha="${current_tag#main-}"
            if [ "$current_sha" = "$IMAGE_TAG" ]; then
              echo "Image for $service already points to $IMAGE_TAG"
              return 1
            fi

            if git rev-parse --verify "${current_sha}^{commit}" >/dev/null 2>&1; then
              if git merge-base --is-ancestor "$IMAGE_TAG" "$current_sha"; then
                echo "Skipping stale image update for $service: current tag $current_sha is newer than $IMAGE_TAG"
                return 1
              fi
            fi

            return 0
          }

          update_service_image() {
            local service="$1"
            if should_update_service "$service"; then
              kustomize edit set image \
                "${service}=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${service}:main-${IMAGE_TAG}"
              UPDATED=true
            fi
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B ci-update-manifests origin/main

            UPDATED=false
            cd k8s/overlays/production

            if [ "${{ needs.merge-cache.result }}" == "success" ]; then
              update_service_image cache
            fi

            if [ "${{ needs.merge-tiles.result }}" == "success" ]; then
              update_service_image tiles
            fi

            if [ "${{ needs.merge-auth.result }}" == "success" ]; then
              update_service_image auth
            fi

            if [ "${{ needs.merge-routes.result }}" == "success" ]; then
              update_service_image routes
            fi

            if [ "${{ needs.merge-photo-worker.result }}" == "success" ]; then
              update_service_image photo-worker
            fi

            if [ "${{ needs.merge-frontend.result }}" == "success" ]; then
              update_service_image frontend
            fi

            cd ../..

            if [ "$UPDATED" != "true" ]; then
              echo "No manifest changes needed"
              exit 0
            fi

            git add k8s/overlays/production/kustomization.yaml
            git diff --cached --quiet && exit 0
            git commit -m "ci: update image tags to ${GITHUB_SHA::7}"

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 2
          done

          echo "Failed to push manifest update after retries"
          exit 1
